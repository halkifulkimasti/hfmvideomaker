  <title>HFM Video Maker — AI Video & Voice Studio</title>

  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1c1c1e;
      --card-2: #27272a;
      --border: #323236;
      --text: #ffffff;
      --muted: #a1a1aa;
      --accent: #f59e0b;
      --accent-hover: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.55; padding: 12px; }
    .container { max-width: 780px; margin: 0 auto; }

    /* Top AdSense-Friendly Navigation Bar */
    .top-nav {
      display: flex; align-items: center; gap: 14px; overflow-x: auto;
      background: var(--card); border: 1px solid var(--border);
      padding: 10px 14px; border-radius: 12px; margin-bottom: 12px;
      white-space: nowrap; scrollbar-width: none;
    }
    .top-nav::-webkit-scrollbar { display: none; }
    .top-nav a {
      color: #d4d4d8; text-decoration: none; font-size: 0.84rem; font-weight: 600;
    }
    .top-nav a.active, .top-nav a:hover { color: var(--accent); }

    /* Clean Mobile-First Channel Header */
    .channel-header {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; margin-bottom: 14px;
    }
    .channel-top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .channel-info { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.1rem; color: #000; flex-shrink: 0;
    }
    .channel-title h1 { font-size: 1.2rem; font-weight: 700; color: #fff; }
    .channel-meta { font-size: 0.8rem; color: var(--muted); }
    .channel-engines { font-size: 0.78rem; color: var(--accent); margin-top: 8px; font-weight: 600; }

    /* YouTube-Style Subscribe Pill Button */
    .yt-sub-pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: #ffffff; color: #0f0f0f; border: none;
      padding: 9px 16px; border-radius: 999px; font-weight: 700;
      font-size: 0.88rem; cursor: pointer; transition: 0.15s;
    }
    .yt-sub-pill.subscribed {
      background: #27272a; color: #ffffff; border: 1px solid #3f3f46;
    }

    /* YouTube-Style Bottom Sheet Modal */
    .sheet-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: none; align-items: flex-end; justify-content: center; z-index: 1000;
    }
    .sheet-backdrop.open { display: flex; }
    .bottom-sheet {
      width: 100%; max-width: 540px; background: #212121;
      border-top-left-radius: 18px; border-top-right-radius: 18px;
      padding: 12px 16px 24px; border-top: 1px solid #383838;
      animation: slideUp 0.2s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-handle {
      width: 40px; height: 4px; background: #52525b; border-radius: 99px;
      margin: 0 auto 14px;
    }
    .sheet-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
    .sheet-subtitle { font-size: 0.82rem; color: #a1a1aa; margin-bottom: 14px; }
    .sheet-option {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      background: transparent; color: #fff; border: none; padding: 13px 8px;
      font-size: 0.96rem; cursor: pointer; border-radius: 10px; text-align: left;
    }
    .sheet-option:hover { background: #303030; }
    .sheet-option-left { display: flex; align-items: center; gap: 14px; }
    .sheet-divider { height: 1px; background: #333; margin: 6px 0; }

    /* Clean 2-Button Studio Switcher */
    .studio-switcher {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: var(--card); padding: 6px; border-radius: 14px;
      border: 1px solid var(--border); margin-bottom: 14px;
    }
    .switch-btn {
      background: transparent; color: var(--muted); border: none;
      padding: 12px 10px; border-radius: 10px; font-weight: 700;
      font-size: 0.92rem; cursor: pointer; transition: 0.15s;
    }
    .switch-btn.active { background: var(--accent); color: #000; }

    /* Studio Cards */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 16px; margin-bottom: 16px;
    }
    .card h2 { font-size: 1.1rem; margin-bottom: 10px; color: #fff; }
    .card h3 { font-size: 0.95rem; margin: 14px 0 4px; color: var(--accent); }
    .card p { font-size: 0.88rem; color: #d4d4d8; margin-bottom: 8px; }
