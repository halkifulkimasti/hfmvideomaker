<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — HFM Video Maker</title>
  <style>
    body { background:#0f0f0f; color:#e4e4e7; font-family:system-ui,sans-serif; line-height:1.7; padding:20px; max-width:800px; margin:auto; }
    a { color:#f59e0b; text-decoration:none; }
    h1, h2 { color:#fff; margin-top:20px; }
    .nav { background:#1c1c1e; padding:12px 16px; border-radius:12px; margin-bottom:20px; display:flex; gap:14px; flex-wrap:wrap; }
    .card { background:#1c1c1e; border:1px solid #323236; padding:18px; border-radius:14px; margin-top:16px; }
    label { display:block; margin:12px 0 6px; font-weight:600; font-size:0.9rem; }
    input, textarea { width:100%; background:#121214; color:#fff; border:1px solid #323236; border-radius:10px; padding:11px; box-sizing:border-box; }
    button { width:100%; background:#f59e0b; color:#000; border:none; padding:12px; border-radius:10px; font-weight:700; margin-top:14px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="index.html">🏠 Home</a>
    <a href="guide.html">How to Use</a>
    <a href="about.html">About Us</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms</a>
    <a href="contact.html">Contact Us</a>
  </div>
  <h1>Contact Us</h1>
  <p>Have questions, feedback, or business inquiries about <strong>HFM Video Maker</strong>? Email us directly at <strong>halkifulkimasti@gmail.com</strong> or fill out the form below:</p>
  <div class="card">
    <label for="cName">Your Name</label>
    <input type="text" id="cName" placeholder="Enter your full name" />
    <label for="cEmail">Your Email Address</label>
    <input type="email" id="cEmail" placeholder="you@example.com" />
    <label for="cMsg">Message</label>
    <textarea id="cMsg" rows="4" placeholder="Write your message here..."></textarea>
    <button onclick="submitForm()">Send Message</button>
    <p id="cStatus" style="color:#facc15; margin-top:12px; font-weight:600;"></p>
  </div>
  <script>
    function submitForm() {
      const n = document.getElementById("cName").value.trim();
      const e = document.getElementById("cEmail").value.trim();
      const m = document.getElementById("cMsg").value.trim();
      const st = document.getElementById("cStatus");
      if (!n || !e || !m) { st.textContent = "❌ Please fill in all fields."; return; }
      st.textContent = `✅ Thank you, ${n}! Your message has been sent to halkifulkimasti@gmail.com. We will reply to ${e} within 24–48 hours.`;
      document.getElementById("cName").value = "";
      document.getElementById("cEmail").value = "";
      document.getElementById("cMsg").value = "";
    }
  </script>
</body>
</html>
